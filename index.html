<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia | HH Transportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        #video { width: 100%; border-radius: 10px; background: #000; }
        .btn-checkin { background-color: #1a73e8; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="card p-4">
    <div class="text-center mb-3">
        <h4 id="displayNombre">Cargando...</h4>
        <p class="text-muted small">ID: <span id="displayID">---</span> | Sede: <span id="displaySede">---</span></p>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="mt-3 d-grid gap-2">
        <button id="btnEntrada" class="btn btn-checkin btn-lg">REGISTRAR ENTRADA</button>
        <button id="btnSalida" class="btn btn-outline-danger">REGISTRAR SALIDA</button>
    </div>
    <div id="status" class="mt-2 text-center small"></div>
</div>

<script>
    document.oncontextmenu = () => false;
    document.onkeydown = e => {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };
</script>

<script src="js/security_module.js"></script>
</body>
</html>
