<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HH Transportes | Registro de Asistencia</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #e9ecef; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card-registro { width: 100%; max-width: 400px; border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: #fff; overflow: hidden; }
    .header-blue { background: #1a73e8; color: #fff; padding: 20px; text-align: center; }
    #video { width: 100%; height: 300px; object-fit: cover; background: #000; }
    .btn-registro { padding: 15px; font-weight: 700; border-radius: 12px; transition: all 0.3s; }
    .btn-entrada { background-color: #1a73e8; color: white; border: none; }
    .btn-entrada:hover { background-color: #1557b0; }
    .info-user { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #eee; }
    #status { font-weight: 600; min-height: 24px; }
    canvas { display: none; }
  </style>
</head>
<body>

<div class="card-registro">
  <div class="header-blue">
    <h5 class="mb-0"><i class="fas fa-truck-moving me-2"></i>HH TRANSPORTES</h5>
    <small class="opacity-75">Control de Asistencia v3.0</small>
  </div>

  <div class="info-user text-center">
    <h5 id="displayNombre" class="mb-1 text-primary">Cargando...</h5>
    <div class="d-flex justify-content-center gap-3 text-muted small">
      <span><i class="fas fa-id-badge"></i> ID: <b id="displayID">---</b></span>
      <span><i class="fas fa-map-marker-alt"></i> Sede: <b id="displaySede">---</b></span>
    </div>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="p-4 d-grid gap-3">
    <button id="btnEntrada" class="btn btn-registro btn-entrada shadow-sm">
      <i class="fas fa-sign-in-alt me-2"></i> REGISTRAR ENTRADA
    </button>
    <button id="btnSalida" class="btn btn-registro btn-outline-danger">
      <i class="fas fa-sign-out-alt me-2"></i> REGISTRAR SALIDA
    </button>
    <div id="status" class="text-center small"></div>
  </div>
</div>

<script>
  // Evita el clic derecho
  document.oncontextmenu = () => false;
  // Evita F12 y combinaciones de teclas de desarrollo
  document.onkeydown = (e) => {
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && e.keyCode == 85)) {
      return false;
    }
  };
</script>

<script src="js/security_module.js"></script>

</body>
</html>
